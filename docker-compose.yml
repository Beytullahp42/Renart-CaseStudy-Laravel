name: ${COMPOSE_PROJECT_NAME:-renart-case-study}

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renart_case_study}
      POSTGRES_USER: ${POSTGRES_USER:-renart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renart_password}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      APP_NAME: ${RENART_APP_NAME:-Renart Case Study API}
      APP_ENV: ${RENART_APP_ENV:-production}
      APP_KEY: ${RENART_APP_KEY:-}
      APP_DEBUG: ${RENART_APP_DEBUG:-false}
      APP_URL: ${RENART_APP_URL:-http://localhost:8000}
      APP_LOCALE: ${RENART_APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${RENART_APP_FALLBACK_LOCALE:-en}
      LOG_CHANNEL: ${RENART_LOG_CHANNEL:-stack}
      LOG_STACK: ${RENART_LOG_STACK:-single}
      LOG_LEVEL: ${RENART_LOG_LEVEL:-warning}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-renart_case_study}
      DB_USERNAME: ${POSTGRES_USER:-renart_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-renart_password}
      SESSION_DRIVER: ${RENART_SESSION_DRIVER:-database}
      CACHE_STORE: ${RENART_CACHE_STORE:-database}
      QUEUE_CONNECTION: ${RENART_QUEUE_CONNECTION:-sync}
      FILESYSTEM_DISK: ${RENART_FILESYSTEM_DISK:-local}
      MAIL_MAILER: ${RENART_MAIL_MAILER:-log}
      GOLD_API_KEY: ${GOLD_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      RUN_MIGRATIONS: ${RENART_RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RENART_RUN_SEEDERS:-false}
      WAIT_FOR_DB: ${RENART_WAIT_FOR_DB:-true}
      CACHE_CONFIG: ${RENART_CACHE_CONFIG:-true}
      CACHE_VIEWS: ${RENART_CACHE_VIEWS:-true}
    expose:
      - "9000"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy

  backend-nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8000}:80"
    volumes:
      - backend_storage:/var/www/html/storage:ro
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ../Renart-CaseStudy-React
      target: production
      args:
        VITE_API_BASE_URL: ${FRONTEND_VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend-nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  backend_storage:
